# Community widgets without code (ADR-0030): a field for every ${NAME} an addable community widget uses, and the
# repairs that turn each README's YAML into one a user can set up with fields. scripts/community-widgets.ts applies it
# to the pinned README YAML and checks every variant with the pinned Glance; it names anything that no longer fits.
# values: label, help (one line), kind (url | host | secret | text | number | choice | boolean | list | date), example
#   (required ones), default and optional: true (optional ones), choices (choice).
# widgets: per widget folder, `needs` (one sentence), and per variant in the snapshot's order (null: nothing to change):
#   name, rewrite (exact find/replace, count = occurrences), refuse (the reason a user reads).
values:
  ABS_LIBRARY:
    label: Library name
    help: The library's name exactly as Audiobookshelf shows it, like Audiobooks or Podcasts
    kind: text
    example: Audiobooks
  ABS_PROGRESS_BAR:
    label: Show progress bar
    help: Shows how far you got, on the continue-listening and listen-again shelves
    kind: boolean
    example: "false"
    default: "true"
    optional: true
  ABS_SHELF:
    label: Shelf
    help: "Books: continue-listening, continue-series, recently-added, listen-again; podcasts: continue-listening, newest-episodes, recently-added, listen-again"
    kind: choice
    example: recently-added
    default: continue-listening
    choices:
      - continue-listening
      - continue-series
      - recently-added
      - listen-again
      - newest-episodes
  ABS_SHOW_THUMBNAIL:
    label: Show covers
    help: Shows covers; this puts the API key into the page, so don't turn it on for a dashboard reachable from the internet
    kind: boolean
    example: "true"
    default: "false"
    optional: true
  ABS_SMALL_COLUMN:
    label: Small column
    help: Turn on when the widget sits in a small column
    kind: boolean
    example: "true"
    default: "false"
    optional: true
  ABS_THUMBNAIL_ASPECT:
    label: Cover shape
    help: "default: as the cover is; square; portrait (2:3); landscape (16:9)"
    kind: choice
    example: portrait
    default: square
    choices:
      - default
      - square
      - portrait
      - landscape
    optional: true
  AIR_QUALITY_LAT:
    label: Latitude
    help: Your location's latitude in decimal degrees, like 52.52 (south is negative); the nearest WAQI station is used
    kind: number
    example: "52.52"
  AIR_QUALITY_LON:
    label: Longitude
    help: Your location's longitude in decimal degrees, like 13.405 (west is negative)
    kind: number
    example: "13.405"
  AIR_QUALITY_TOKEN:
    label: WAQI API token
    help: A free token from aqicn.org/data-platform/token
    kind: secret
    example: 0123456789abcdef0123456789abcdef01234567
  AIRCRAFT_LAT_MAX:
    label: Northern edge (latitude)
    help: The area's northern edge in decimal degrees, like 52.7
    kind: number
    example: "52.7"
  AIRCRAFT_LAT_MIN:
    label: Southern edge (latitude)
    help: The area's southern edge in decimal degrees, like 52.3
    kind: number
    example: "52.3"
  AIRCRAFT_LON_MAX:
    label: Eastern edge (longitude)
    help: The area's eastern edge in decimal degrees, like 13.7
    kind: number
    example: "13.7"
  AIRCRAFT_LON_MIN:
    label: Western edge (longitude)
    help: The area's western edge in decimal degrees, like 13.1
    kind: number
    example: "13.1"
  ALGAL_BEACH_ID:
    label: Beach ID
    help: The beach's ID on beachsafe.org.au, like brighton-3; it ends the api/v4/beach/ address your browser loads when you open the beach (developer tools, Network tab)
    kind: text
    example: brighton-3
  ARR_API_KEY:
    label: API key
    help: "In Sonarr, Radarr or Lidarr: Settings → General → Security → API Key"
    kind: secret
    example: 0123456789abcdef0123456789abcdef
  ARR_API_URL:
    label: Sonarr, Radarr or Lidarr address
    help: The address Glance uses to reach the app, with its port, like http://192.0.2.10:7878, no slash at the end
    kind: url
    example: http://192.0.2.10:7878
  ARR_COLLAPSE_AFTER:
    label: Items before "Show more"
    help: How many items show before the list collapses
    kind: number
    example: "5"
    default: "3"
    optional: true
  ARR_COVER_PROXY:
    label: Cover proxy address
    help: Only with a reverse proxy that serves covers with the key added (the README shows how), so the key stays out of the page and covers load over https; like https://proxy.example.com/radarrcover
    kind: url
    example: https://proxy.example.com/radarrcover
    default: ""
    optional: true
  ARR_INTERVAL_DAYS:
    label: Days
    help: Only items within this many days, ahead for upcoming and back for recent or missing
    kind: number
    example: "14"
    default: "20"
    optional: true
  ARR_LINK_URL:
    label: Address for links
    help: Only if links and the title should open another address than the one above, like https://radarr.example.com; leave empty to use that one
    kind: url
    example: https://radarr.example.com
    default: ""
    optional: true
  ARR_SERVICE:
    label: App
    help: Which app the address and API key below belong to
    kind: choice
    example: sonarr
    default: radarr
    choices:
      - sonarr
      - radarr
      - lidarr
  ARR_SHOW_GRABBED:
    label: Show grabbed status
    help: Shows a Grabbed/Missing button instead of the description (still shown when hovering the cover)
    kind: boolean
    example: "true"
    default: "false"
    optional: true
  ARR_SIZE:
    label: Cover size
    help: small, medium, large or huge; small moves the Grabbed/Missing button to the right
    kind: choice
    example: small
    default: medium
    choices:
      - small
      - medium
      - large
      - huge
    optional: true
  ARR_SORT_TIME:
    label: Sort order
    help: "desc: latest date first; asc: earliest date first"
    kind: choice
    example: asc
    default: desc
    choices:
      - desc
      - asc
    optional: true
  ARR_TYPE:
    label: Show
    help: "upcoming: soon to release; recent: recently grabbed; missing: available but not grabbed"
    kind: choice
    example: recent
    default: upcoming
    choices:
      - upcoming
      - recent
      - missing
  AUDIOBOOKSHELF_KEY:
    label: Audiobookshelf API key
    help: "In Audiobookshelf: Settings → API Keys (older versions: Settings → Users → your account → API token)"
    kind: secret
    example: eyJhbGciOiJIUzI1NiJ9.example.signature
  AUDIOBOOKSHELF_URL:
    label: Audiobookshelf address
    help: Like http://192.0.2.10:13378 or https://audiobookshelf.example.com, no slash at the end
    kind: url
    example: http://192.0.2.10:13378
  AZIREVPN_HIDE_IP:
    label: Hide the IP address
    help: Shows "Redacted" instead of the public IP address
    kind: boolean
    example: "true"
    default: "false"
    optional: true
  BACKREST_LIMIT:
    label: Backups shown
    help: The most backups to list
    kind: number
    example: "10"
    default: "5"
    optional: true
  BACKREST_PLAN_HEADING:
    label: Heading
    help: The heading above the list, like Local USB or Amazon S3
    kind: text
    example: Amazon S3
    default: Backups
    optional: true
  BACKREST_PLAN_LOCAL:
    label: Backup plan ID
    help: The ID of the Backrest plan to show, as set in Backrest's plans
    kind: text
    example: local-usb
  BACKREST_PRECISION:
    label: Size decimals
    help: Decimal places for the backup size in GB
    kind: number
    example: "2"
    default: "1"
    optional: true
  BACKREST_URL:
    label: Backrest address
    help: Like http://192.0.2.10:9898, no slash at the end
    kind: url
    example: http://192.0.2.10:9898
  BESZEL_EMAIL:
    label: Beszel e-mail
    help: The e-mail address you log in to Beszel with
    kind: text
    example: user@example.com
  BESZEL_PASSWORD:
    label: Beszel password
    help: The password you log in to Beszel with
    kind: secret
    example: correct-horse-battery
  BESZEL_TOKEN:
    label: Beszel API token
    help: Only to use a token instead of the e-mail and password (the README shows how to get one); leave empty otherwise
    kind: secret
    example: eyJhbGciOiJIUzI1NiJ9.example.signature
    default: ""
    optional: true
  BESZEL_URL:
    label: Beszel hub address
    help: Like http://192.0.2.10:8090 or https://beszel.example.com, no slash at the end
    kind: url
    example: http://192.0.2.10:8090
  BIBLE_TRANSLATION:
    label: Translation
    help: A translation ID from bible-api.com; web is the World English Bible
    kind: text
    default: web
    optional: true
  BLUESKY_FEED_URI:
    label: Bluesky feed
    help: The feed's at:// address (at://did:…/app.bsky.feed.generator/…); only posts with a link card show
    kind: text
    example: at://did:plc:abcdefghijklmnopqrstuvwx/app.bsky.feed.generator/example-feed
    default: at://did:plc:kkf4naxqmweop7dv4l2iqqf5/app.bsky.feed.generator/news-2-0
    optional: true
  CALIBREWEB_PASSWORD:
    label: Calibre-Web password
    help: That user's password
    kind: secret
    example: correct-horse-battery
  CALIBREWEB_URL:
    label: Calibre-Web address
    help: Like http://192.0.2.10:8083 or https://calibre.example.com, no slash at the end
    kind: url
    example: http://192.0.2.10:8083
  CALIBREWEB_USER:
    label: Calibre-Web user name
    help: A Calibre-Web user the widget logs in as
    kind: text
    example: reader
  CALVIN_YEAR_OFFSET:
    label: Years back
    help: Shows the strip from this many years ago today; strips exist from 18 Nov 1985 to 31 Dec 1995
    kind: number
    example: "35"
    default: "37"
    optional: true
  CAT_TAGS:
    label: Cat tags
    help: Tags separated by commas, no spaces, like cute,orange; with many tags few or no photos match; empty for any cat
    kind: list
    example: cute,orange
    default: ""
    optional: true
  CF_ACCOUNT_ID:
    label: Cloudflare account ID
    help: Your Cloudflare account ID (32 letters and digits), shown on your account's overview page
    kind: text
    example: 0123456789abcdef0123456789abcdef
  CF_API_TOKEN:
    label: Cloudflare API token
    help: An API token with the Account → Cloudflare Tunnel → Read permission
    kind: secret
    example: example-token-0123456789abcdefghijklmnopqrstuv
  CF_TUNNEL_ID:
    label: Tunnel ID
    help: The ID of the Cloudflare tunnel to watch
    kind: text
    example: 01234567-89ab-cdef-0123-456789abcdef
  CINEPLEX_FILTER:
    label: Only titles containing
    help: Shows only movies whose title contains this text (case-sensitive); empty for all
    kind: text
    example: Japanese
    default: ""
    optional: true
  CINEPLEX_ITEMS:
    label: Movies shown
    help: The most movies to show
    kind: number
    example: "8"
    default: "10"
    optional: true
  CINEPLEX_NOW_PLAYING_ONLY:
    label: Now playing only
    help: Hides movies that aren't playing yet
    kind: boolean
    example: "true"
    default: "false"
    optional: true
  CINEPLEX_SUBSCRIPTION_KEY:
    label: Cineplex API key
    help: The ocp-apim-subscription-key header that cineplex.com sends to apis.cineplex.com (your browser's developer tools, Network tab)
    kind: secret
    example: 0123456789abcdef0123456789abcdef
  CLOUDFLARE_ACCOUNT_ID:
    label: Cloudflare account ID
    help: Your Cloudflare account ID (32 letters and digits), shown on your account's overview page
    kind: text
    example: 0123456789abcdef0123456789abcdef
  CLOUDFLARE_API_KEY:
    label: Cloudflare API token
    help: An API token (not the Global API Key) with the Account → Cloudflare Tunnel → Read permission
    kind: secret
    example: example-token-0123456789abcdefghijklmnopqrstuv
  CLOUDFLARE_TUNNEL_ID:
    label: Tunnel ID
    help: The ID of the Cloudflare tunnel whose public hostnames to list
    kind: text
    example: 01234567-89ab-cdef-0123-456789abcdef
  CLOUDFLARED_DOMAIN:
    label: Domain to hide in names
    help: Your domain with a leading dot, like .example.com; it is cut from the end of each hostname shown
    kind: text
    example: .example.com
    default: ""
    optional: true
  CLOUDFLARED_LOCAL_HOST:
    label: Address for local links
    help: The LAN address of the machine that runs cloudflared, like 192.0.2.10; local links to services set as localhost use it
    kind: text
    example: 192.0.2.10
    default: localhost
    optional: true
  CRAFTY_API_TOKEN:
    label: Crafty API token
    help: An API token from Crafty Controller with Full Access permission
    kind: secret
    example: eyJhbGciOiJIUzI1NiJ9.example.signature
  CRAFTY_DISPLAY_MOTD:
    label: Show the message of the day
    help: Shows the server's MOTD under its name
    kind: boolean
    example: "false"
    default: "true"
    optional: true
  CRAFTY_SERVER_ID:
    label: Server ID
    help: The id= value in the address of the server's page in Crafty (…/panel/server_detail?id=…)
    kind: text
    example: 01234567-89ab-cdef-0123-456789abcdef
  CRAFTY_URL:
    label: Crafty Controller address
    help: With https:// (or http://) and the port, like https://192.0.2.10:8443, no slash at the end
    kind: url
    example: https://192.0.2.10:8443
  CRYPTOPANIC_CURRENCIES:
    label: Currencies
    help: Currency codes separated by commas, no spaces, like BTC,ETH; empty for all
    kind: list
    example: BTC,ETH
    default: ""
    optional: true
  CRYPTOPANIC_FILTER:
    label: News filter
    help: One of rising, hot, bullish, bearish or important; empty for all news
    kind: text
    example: hot
    default: ""
    optional: true
  CRYPTOPANIC_KIND:
    label: Kind
    help: news or media; empty for both
    kind: text
    example: news
    default: ""
    optional: true
  CRYPTOPANIC_REGIONS:
    label: Regions
    help: Language codes separated by commas, no spaces, like en,de; empty for the default
    kind: list
    example: en,de
    default: ""
    optional: true
  CRYPTOPANIC_TOKEN:
    label: CryptoPanic API token
    help: The API auth token from your account on cryptopanic.com
    kind: secret
    example: 0123456789abcdef0123456789abcdef01234567
  CUP_DEFAULT_SERVER_NAME:
    label: Default server name
    help: The name shown for images whose server Cup doesn't report
    kind: text
    example: Home server
    default: Glance
    optional: true
  CUP_ONLY_IN_USE:
    label: Only images in use
    help: Hides updates for images no container uses
    kind: boolean
    example: "false"
    default: "true"
    optional: true
  CUP_SHOW_UPDATE_KIND:
    label: Show update types
    help: Shows the Major, Minor, Patch, Digest and Unknown counts
    kind: boolean
    example: "false"
    default: "true"
    optional: true
  CUP_URL:
    label: Cup server address (without http://)
    help: Host and port of your Cup server, like 192.0.2.10:8000; the widget adds http:// itself
    kind: host
    example: 192.0.2.10:8000
  DAWARICH_API_KEY:
    label: Dawarich API key
    help: "In Dawarich: click your profile photo (top right) → Account"
    kind: secret
    example: 0123456789abcdef0123456789abcdef
  DAWARICH_URL:
    label: Dawarich address
    help: Like http://192.0.2.10:3000 or https://dawarich.example.com, no slash at the end
    kind: url
    example: http://192.0.2.10:3000
  DHL_API_KEY:
    label: DHL API key
    help: From an app on developer.dhl.com that includes the "Shipment Tracking - Unified" API; access can take a few days to be granted
    kind: secret
    example: AbCdEfGhIjKlMnOpQrStUvWxYz012345
  DHL_LANGUAGE:
    label: Language
    help: Two-letter language code for the event descriptions, like en or de
    kind: text
    example: de
    default: en
    optional: true
  DHL_TRACKING_NUMBER:
    label: Tracking number
    help: The DHL shipment's tracking number
    kind: text
    example: "00340434000000000000"
  DISCOPANEL_HOST:
    label: DiscoPanel address
    help: Like http://192.0.2.10:8080 or https://discopanel.example.com, no slash at the end
    kind: url
    example: http://192.0.2.10:8080
  DISCOPANEL_TOKEN:
    label: DiscoPanel API token
    help: "An API token from DiscoPanel's user page (v2.0.0 or later), for a user with the Read: Servers and Read: Server Config permissions"
    kind: secret
    example: dp_0123456789abcdef0123456789abcdef
  DUO_JWT_TOKEN:
    label: Duolingo login token (JWT)
    help: From the Authorization header of any duolingo.com API request in the developer tools; paste only the part after "Bearer ". Renew it if the widget stops working
    kind: secret
    example: eyJhbGciOiJIUzI1NiJ9.example.signature
  DUO_USER_ID:
    label: Duolingo user ID
    help: A number like 1234567890. Log in on duolingo.com, open the browser's developer tools (F12) → Network and look for an API call that contains it
    kind: number
    example: "1234567890"
  EPIC_ALLOW_COUNTRIES:
    label: Allowed countries
    help: Country codes separated by commas, usually the same as Country
    kind: list
    example: DE
    default: US
    optional: true
  EPIC_COUNTRY:
    label: Country
    help: Two-letter country code for regional availability, like US, FR, DE or ES
    kind: text
    example: DE
    default: US
    optional: true
  EPIC_LOCALE:
    label: Language
    help: Language code for game titles, like en, fr, de or es
    kind: text
    example: de
    default: en
    optional: true
  EVENTIM_CITIES:
    label: Cities
    help: Where to look for events; several cities separated by commas. Leave empty for everywhere
    kind: list
    example: Berlin,Hamburg
    default: ""
    optional: true
  EVENTIM_SEARCH_TERM:
    label: Search for
    help: An event or band name, or a kind of event like concert or sport event; searches eventim.de. Leave empty for all events
    kind: text
    example: concert
    default: ""
    optional: true
  F1_TIMEZONE:
    label: Time zone
    help: Session times are shown in this zone, like Europe/Berlin. Use the zone Glance runs in (its TZ setting), or the countdowns are off
    kind: text
    example: Europe/Berlin
  FOOTBALL_COMPETITION_ID:
    label: Competition ID
    help: The league's number on football-data.org, from the list at api.football-data.org/v4/competitions
    kind: number
    example: "2021"
  FOOTBALL_DATA_TOKEN:
    label: football-data.org API key
    help: Sent to you by e-mail when you register at football-data.org/client/register
    kind: secret
    example: 0123456789abcdef0123456789abcdef
  FOOTBALL_FIXTURES_TEAM_ID:
    label: Team ID
    help: Your team's number on football-data.org (see football-data.org/coverage)
    kind: number
    example: "123"
  FOOTBALL_TABLE_TEAM_ID:
    label: Team to highlight
    help: Your team's number on football-data.org; its row is highlighted. 0 highlights none
    kind: number
    example: "123"
    default: "0"
    optional: true
  FORGEJO_TOKEN:
    label: Forgejo access token
    help: An access token for your Forgejo user (created in Forgejo under Settings → Applications)
    kind: secret
    example: 0123456789abcdef0123456789abcdef01234567
  FORGEJO_URL:
    label: Forgejo host and port
    help: Like 192.0.2.10:3000, without http:// (the widget adds it) and no slash at the end
    kind: host
    example: 192.0.2.10:3000
  FRED_API_KEY:
    label: FRED API key
    help: A free key from fred.stlouisfed.org/docs/api/api_key.html
    kind: secret
    example: 0123456789abcdef0123456789abcdef
  FRED_SERIES_ID:
    label: FRED series
    help: The ID at the end of a series' address on fred.stlouisfed.org; MORTGAGE30US is the 30-year fixed rate. The widget is made for a rate in percent.
    kind: text
    default: MORTGAGE30US
    optional: true
  FRESHRSS_QUERY_TOKEN:
    label: Shared query token
    help: 'In FreshRSS: pick a category, bookmark the current query, enable sharing by HTML & RSS, then copy the t= part of its "Shareable link to the GReader JSON"'
    kind: secret
    example: 0123456789abcdef
  FRESHRSS_URL:
    label: FreshRSS address
    help: Like http://192.0.2.10:8080, no slash at the end
    kind: url
    example: http://192.0.2.10:8080
  FRESHRSS_USER:
    label: FreshRSS user name
    help: The user= part of the query's "Shareable link to the GReader JSON"
    kind: text
    example: alice
  FRIGATE_TOKEN:
    label: Frigate login token
    help: "Only if Frigate asks for a login: a JWT for your Frigate user, signed (HS256) with the secret in the .jwt_secret file of Frigate's config folder. Leave empty otherwise"
    kind: secret
    example: eyJhbGciOiJIUzI1NiJ9.example.signature
    default: ""
    optional: true
  FRIGATE_URL:
    label: Frigate host and port
    help: Like 192.0.2.10:8971, without https://; the widget always connects with https://
    kind: host
    example: 192.0.2.10:8971
  GATUS_COMPACT_METRIC:
    label: Compact style shows
    help: Which number the compact style shows for each endpoint
    kind: choice
    example: response-time
    default: uptime
    choices:
      - uptime
      - response-time
    optional: true
  GATUS_DURATION:
    label: Averaged over
    help: The period for uptime and response time
    kind: choice
    example: 7d
    default: 24h
    choices:
      - 1h
      - 24h
      - 7d
      - 30d
    optional: true
  GATUS_GROUP:
    label: Only this group
    help: Show only the endpoints of this Gatus group. Leave empty for all groups
    kind: text
    example: core
    default: ""
    optional: true
  GATUS_SHOW_FAILING_ONLY:
    label: Show failing endpoints only
    help: Hide endpoints whose last check passed
    kind: boolean
    example: "true"
    default: "false"
    optional: true
  GATUS_STYLE:
    label: Style
    help: full (icons, uptime and response time) or compact (one line per endpoint)
    kind: choice
    example: compact
    default: full
    choices:
      - full
      - compact
    optional: true
  GATUS_URL:
    label: Gatus address
    help: Like http://192.0.2.10:8080, no slash at the end
    kind: url
    example: http://192.0.2.10:8080
  GH_ACTIONS_BRANCH:
    label: Branch
    help: Only runs on this branch, like main
    kind: text
    example: main
  GH_ACTIONS_COLLAPSE_AFTER:
    label: Shown before "Show more"
    help: How many runs are visible before the list collapses
    kind: number
    example: "4"
    default: "2"
    optional: true
  GH_ACTIONS_COUNT:
    label: Runs to fetch
    help: How many recent workflow runs to load
    kind: number
    example: "10"
    default: "6"
    optional: true
  GH_ACTIONS_REPO:
    label: Repository
    help: Owner and repository name as in its GitHub address, like octo-org/example-repo
    kind: text
    example: octo-org/example-repo
  GHOSTFOLIO_ACCESS_ID:
    label: Public access ID
    help: "In Ghostfolio: My Ghostfolio → Access → Add a public access; the ID is the last part of its link"
    kind: text
    example: 0a1b2c3d-4e5f-4a7b-8c9d-0e1f2a3b4c5d
  GHOSTFOLIO_URL:
    label: Ghostfolio address
    help: Like http://192.0.2.10:3333, no slash at the end
    kind: url
    example: http://192.0.2.10:3333
  GITHUB_TOKEN:
    label: GitHub personal access token
    help: GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic); give it the notifications and repo scopes
    kind: secret
    example: ghp_exampleexampleexampleexample0000
  GLANCES_DISK_MOUNTS:
    label: Disks to show
    help: Mount points, like /mnt/data; several separated by |
    kind: list
    example: /mnt/data|/mnt/backup
  GLANCES_HOST:
    label: Glances host
    help: The Glances server's host name or IP, like 192.0.2.10, without http:// or a port; the widget adds http:// and port 61208
    kind: host

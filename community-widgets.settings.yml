    example: fghij-67890
  SYNCTHING_FOLDER_2_NAME:
    label: Second folder's name
    help: The name the widget shows for it
    kind: text
    default: Backup Folder 2
    optional: true
  SYNCTHING_URL:
    label: Syncthing address
    help: Like http://192.0.2.10:8384, no slash at the end
    kind: url
    example: http://192.0.2.10:8384
  SYNOLOGY_HOST:
    label: NAS address (without http://)
    help: IP address or host name only, without http:// and without the port, like 192.0.2.10
    kind: host
    example: 192.0.2.10
  SYNOLOGY_PASSWORD:
    label: DSM password
    help: That account's password
    kind: secret
    example: correct-horse-battery
  SYNOLOGY_PORT:
    label: DSM port
    help: DSM's HTTP port, 5000 unless you changed it (this widget can't use HTTPS)
    kind: number
    default: "5000"
    optional: true
  SYNOLOGY_USERNAME:
    label: DSM user name
    help: The DSM account the widget signs in with
    kind: text
    example: glance
  TAILSCALE_API_KEY:
    label: Tailscale API access token
    help: Tailscale admin console → Settings → Keys → generate an API key; it lasts 90 days at most
    kind: secret
    example: tskey-api-k0000000000CNTRL-0000000000000000000000000000
  TAILSCALE_COLLAPSE_AFTER:
    label: Devices shown before "Show more"
    kind: number
    default: "3"
    optional: true
  TAILSCALE_DEVICE_IP:
    label: Device's Tailscale IP
    help: The 100.x.y.z address of the device to watch (Tailscale admin console → Machines)
    kind: text
    example: 100.64.0.10
  TAILSCALE_HIDE_OFFLINE_DOT:
    label: Hide the offline dot
    help: Hides the red dot shown for offline devices
    kind: boolean
    default: "false"
    optional: true
  TAILSCALE_HIDE_UPDATE_DOT:
    label: Hide the update dot
    help: Hides the dot shown when a device has an update available
    kind: boolean
    default: "false"
    optional: true
  TAILSCALE_PRIORITISE_TAGS:
    label: Show tag instead of user
    help: Shows a device's first tag instead of its user, when it has one
    kind: boolean
    default: "false"
    optional: true
  TAILSCALE_TAILNET:
    label: Tailnet name
    help: Your tailnet's name, like example.com, or a single - for the tailnet the access token belongs to
    kind: text
    example: example.com
  TAUTULLI_API_KEY:
    label: Tautulli API key
    help: Tautulli → Settings → Web Interface → API → API key
    kind: secret
    example: 0123456789abcdef0123456789abcdef
  TAUTULLI_COLLAPSE:
    label: Items shown before "Show more"
    help: Small layout only
    kind: number
    default: "5"
    optional: true
  TAUTULLI_IP:
    label: Tautulli address (without http://)
    help: IP address or host name only, without http:// and without the port, like 192.0.2.10. Browsers load the posters from it too, so it must work from the devices that open the dashboard.
    kind: host
    example: 192.0.2.10
  TAUTULLI_PLEX_SERVER_ID:
    label: Plex server ID
    help: For the links to Plex. Open any title in Plex Web (app.plex.tv); the long ID after /server/ in the address.
    kind: text
    example: 0123456789abcdef0123456789abcdef01234567
  TAUTULLI_PORT:
    label: Tautulli port
    help: A number, Tautulli's web port; 8181 unless you changed it
    kind: number
    example: "8181"
  TAUTULLI_SIZE:
    label: Layout
    help: small for a list, large for a row of posters
    kind: choice
    choices:
      - small
      - large
    default: small
    optional: true
  TAUTULLI_TIME_RANGE:
    label: Days counted
    help: How many days of history the ranking covers
    kind: number
    default: "90"
    optional: true
  TECHNITIUM_IP_PORT:
    label: Technitium address (without http://)
    help: IP address or host name and port, like 192.0.2.10:5380 (5380 is Technitium's default port); the widget adds http://
    kind: host
    example: 192.0.2.10:5380
  TECHNITIUM_STATS_TIMEFRAME:
    label: Time frame
    help: The period the query counts and top lists cover
    kind: choice
    choices:
      - LastHour
      - LastDay
      - LastWeek
      - LastMonth
      - LastYear
    example: LastDay
  TECHNITIUM_TOKEN:
    label: Technitium API token
    help: "In Technitium: account icon (top right) → Create API Token, for an account in the DNS Administrators group"
    kind: secret
    example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
  TERMIX_ALLOW_INSECURE:
    label: Accept a self-signed certificate
    help: Turn on if Termix uses a self-signed HTTPS certificate
    kind: boolean
    default: "false"
    optional: true
  TERMIX_API_KEY:
    label: Termix API key
    help: "In Termix: Admin → Settings → API Keys (it starts with tmx_)"
    kind: secret
    example: tmx_0123456789abcdef0123456789abcdef
  TERMIX_URL:
    label: Termix address
    help: Like http://192.0.2.10:8080, no slash at the end
    kind: url
    example: http://192.0.2.10:8080
  TFL_LINES:
    label: Lines to show
    help: "[] for all lines, or line names in square brackets separated by commas, like [jubilee, elizabeth]. Names: bakerloo, central, circle, district, hammersmith-city, jubilee, metropolitan, northern, piccadilly, victoria, waterloo-city, elizabeth, liberty, lioness, mildmay, suffragette, weaver, windrush"
    kind: list
    default: "[]"
    optional: true
  TMDB_API_KEY:
    label: TMDB API key
    help: The API Key on your TMDB API dashboard; used for the posters
    kind: secret
    example: 0123456789abcdef0123456789abcdef
  TODOIST_API_TOKEN:
    label: Todoist API token
    help: Todoist Settings → Integrations → Developer → API token
    kind: secret
    example: 0123456789abcdef0123456789abcdef01234567
  TODOIST_FILTER:
    label: Task filter
    help: A Todoist filter that picks the tasks, like today, overdue or today | overdue
    kind: text
    default: today
    optional: true
  TRAKT_API_KEY:
    label: Trakt Client ID
    help: Create an API app on Trakt and copy the Client ID it lists
    kind: secret
    example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  TRAKT_COLLAPSE_AFTER:
    label: Items before "Show more"
    help: How many items show before the list collapses
    kind: number
    default: "3"
    optional: true
  TRAKT_SHOW_EPISODE_NUMBER:
    label: Show episode numbers
    help: Show S##E## next to TV episodes
    kind: boolean
    default: "true"
    optional: true
  TRAKT_SHOW_MOVIE_YEAR:
    label: Show the year of movies
    help: Show the year next to movie titles
    kind: boolean
    default: "false"
    optional: true
  TRAKT_SHOW_TV_YEAR:
    label: Show the year of TV shows
    help: Show the year a TV show started next to its title
    kind: boolean
    default: "false"
    optional: true
  TRAKT_USERNAME:
    label: Trakt user name
    help: The Trakt user whose watch history is shown
    kind: text
    example: example-user
  TRANSITLAND_API_KEY:
    label: Transitland API key
    help: "Free: sign up at transit.land/operators and click API access"
    kind: secret
    example: AbCdEfGh0123456789AbCdEfGh012345
  TRANSITLAND_PER_ROUTE_CAP:
    label: Departures per line
    help: Without a line filter, how many departures show for each line and direction
    kind: number
    default: "2"
    optional: true
  TRANSITLAND_ROUTE_ONESTOP_ID:
    label: Only this line (route Onestop ID)
    help: The route's Onestop ID from its transit.land page, starting with r- (each direction is its own route, ending ~n or ~s); empty shows every line at the stop
    kind: text
    example: r-9q9-example~n
    default: ""
    optional: true
  TRANSITLAND_STOP_KEY:
    label: Stop (Onestop ID)
    help: Search your stop on transit.land and copy the Onestop ID from its page; it starts with s- (a parent station's ID works too)
    kind: text
    example: s-9q9p1abcde-mainst~1st
  TRENDING_REPOS_LANGUAGE:
    label: Language
    help: The repositories' main language; All for every language
    kind: choice
    choices:
      - All
      - JavaScript
      - Java
      - Python
      - PHP
      - C++
      - C#
      - TypeScript
      - Shell
      - C
      - Ruby
      - Rust
      - Go
      - Kotlin
      - HCL
      - PowerShell
      - CMake
      - Groovy
      - PLpgSQL
      - TSQL
      - Dart
      - Swift
      - HTML
      - CSS
      - Elixir
      - Haskell
      - Solidity
      - Assembly
      - R
      - Scala
      - Julia
      - Lua
      - Clojure
      - Erlang
      - Common Lisp
      - Emacs Lisp
      - OCaml
      - MATLAB
      - Objective-C
      - Perl
      - Fortran
    default: All
    optional: true
  TRENDING_REPOS_PERIOD:
    label: Trend period
    help: The period the trend is calculated over
    kind: choice
    choices:
      - past_24_hours
      - past_week
      - past_month
      - past_3_months
    example: past_week
  TRUENAS_API_KEY:
    label: TrueNAS API key
    help: "In TrueNAS: Settings → API Keys"
    kind: secret
    example: 1-AbCdEfGhIjKlMnOpQrStUvWxYz0123456789AbCdEfGhIjKlMnOpQrStUvWx
  TRUENAS_URL:
    label: TrueNAS address
    help: Like http://192.0.2.10 or https://truenas.example.com, no slash at the end
    kind: url
    example: http://192.0.2.10
  TSUMEGO_CATEGORY:
    label: Difficulty
    help: Which of the daily problems to show
    kind: choice
    choices:
      - beginner
      - easy
      - medium
      - hard
    default: medium
    optional: true
  UK_BIN_COLLECTION_URL:
    label: Bin collection address for your council
    help: Your UK Bin Collection API server's address for your council, with its query (uprn or postcode), like http://192.0.2.10:8080/api/bin_collection/ExampleCouncil?uprn=100000000000
    kind: url
    example: http://192.0.2.10:8080/api/bin_collection/ExampleCouncil?uprn=100000000000
  UKBIN_GARDEN_BIN_NAME:
    label: Name of your garden waste bin
    help: The bin's name exactly as your council's data gives it; this bin gets the green colour and recycling icon
    kind: text
    example: Green bin
    default: Food bin, green bin, textiles and garden waste bin
    optional: true
  UKBIN_RUBBISH_BIN_NAME:
    label: Name of your rubbish bin
    help: The bin's name exactly as your council's data gives it; this bin gets the "Rubbish & Food" caption, grey colour and bin icon
    kind: text
    example: Black bin
    default: Grey bin, small electrical items and food bin
    optional: true
  UNIFI_API_KEY:
    label: UniFi API key
    help: "A local API key from the UniFi Network app: Site Settings → Control Plane → Integrations"
    kind: secret
    example: AbCdEfGhIjKlMnOpQrStUvWxYz012345
  UNIFI_CONSOLE_IP:
    label: UniFi console address (without https://)
    help: IP address or host name of your UniFi gateway or console, like 192.0.2.1; the widget adds https://
    kind: host
    example: 192.0.2.1
  UNRAID_API_KEY:
    label: Unraid API key
    help: The API key generated by your Unraid API
    kind: secret
    example: b8a7c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f92a3
  UNRAID_API_URL:
    label: Unraid API address
    help: The address of the Unraid API's GraphQL endpoint, like http://192.0.2.10/graphql
    kind: url
    example: http://192.0.2.10/graphql
  UPTIME_KUMA_STATUS_SLUG:
    label: Status page slug
    help: "In Uptime Kuma: Status Pages → New Status Page, add the monitors to it and Save. Its slug is the last part of its address: for http://192.0.2.10:3001/status/example it is example"
    kind: text
    example: example
    extract: "(?:^|/)status/([^/?#]+)"
  UPTIME_KUMA_URL:
    label: Uptime Kuma address
    help: "The server and port only, like http://192.0.2.10:3001: not the address of a page such as …/dashboard"
    kind: url
    example: http://192.0.2.10:3001
    origin: true
  VIKUNJA_FILTER:
    label: Task filter
    help: A Vikunja filter, typed as is (Vikunja's API docs at /api/v1/docs list the fields), like done=false&&priority>3
    kind: text
    default: ((due_date>now-1d&&due_date<now+10d)||(due_date>now&&priority>3))&&done=false
    optional: true
  VIKUNJA_FILTER_DESCRIPTION:
    label: Filter description
    help: A short text above the table that says which tasks the filter picks
    kind: text
    default: Open tasks due within 10 days, and high-priority ones due later
    optional: true
  VIKUNJA_GLANCE_API_TOKEN:
    label: Vikunja API token
    help: "In Vikunja: avatar → Settings → API Tokens → create one with permission for tasks (tokens expire after 30 days unless you pick Custom)"
    kind: secret
    example: tk_0123456789abcdef0123456789abcdef01234567
  VIKUNJA_HOST:
    label: Vikunja host (without http:// and port)
    help: IP address or host name of your Vikunja server, like 192.0.2.10 (not localhost); the widget adds http://
    kind: host
    example: 192.0.2.10
  VIKUNJA_NUMBER_OF_TASKS:
    label: Number of tasks
    help: At most this many tasks show
    kind: number
    example: "10"
  VIKUNJA_PORT:
    label: Vikunja port
    help: 3456 unless you changed it
    kind: number
    default: "3456"
    optional: true
  WANIKANI_API_KEY:
    label: WaniKani API key
    help: A read-only API token from the WaniKani website's settings
    kind: secret
    example: 01234567-89ab-cdef-0123-456789abcdef
  WANIKANI_SHOW_FORECAST:
    label: Show the forecast
    help: Show bars with the reviews coming up, like the WaniKani dashboard
    kind: boolean
    default: "true"
    optional: true
  WANIKANI_SHOW_LESSONS:
    label: Show lessons
    help: Also show the total number of lessons available
    kind: boolean
    default: "false"
    optional: true
  WEATHER_LOCATION:
    label: Location
    help: A place name Open-Meteo knows, like Berlin, Germany
    kind: text
    example: Berlin, Germany
  WEATHER7_TEMP_UNIT:
    label: Temperature unit
    help: Celsius or Fahrenheit
    kind: choice
    choices:
      - celsius
      - fahrenheit
    default: celsius
    optional: true
  WEATHER7_TIMEZONE:
    label: Time zone for the days
    help: auto uses the location's own time zone; or a time zone name like Europe/Berlin
    kind: text
    default: auto
    optional: true
  WG_EASY_PASSWORD:
    label: WG-Easy password
    help: The password you sign in to the WG-Easy web page with
    kind: secret
    example: example-password
  WG_EASY_URL:
    label: WG-Easy address
    help: The address of the WG-Easy web page, like http://192.0.2.10:51821, no slash at the end
    kind: url
    example: http://192.0.2.10:51821
  WG_EASY_USER:
    label: WG-Easy user name
    help: The user name you sign in to the WG-Easy web page with
    kind: text
    example: admin
  WIKIPEDIA_LANGUAGE:
    label: Wikipedia language
    help: The language code of the Wikipedia edition, like en, de, fr or ja (list at meta.wikimedia.org/wiki/Special:SiteMatrix)
    kind: text
    default: en
    optional: true
  WIKIPEDIA_OTD_TYPE:
    label: What to show
    help: Historical events, people born on this day, or people who died on it
    kind: choice
    choices:
      - events
      - births
      - deaths
    default: events
    optional: true
  WIKIPEDIA_USER_AGENT:
    label: User-Agent for Wikimedia
    help: Wikimedia asks every client to name itself with a contact, like MyDashboard/1.0 (admin@example.com)
    kind: text
    example: MyDashboard/1.0 (admin@example.com)
  WUD_HIDE_UP_TO_DATE:
    label: Hide the up-to-date message
    help: Don't show "All containers are up to date" when nothing needs an update
    kind: boolean
    default: "false"
    optional: true
  WUD_SHOW_ALL:
    label: Show all containers
    help: List every container, not only those with an update
    kind: boolean
    default: "false"
    optional: true
  WUD_SHOW_INFO:
    label: Show the summary
    help: Show the Updates, Total and Running counts
    kind: boolean
    default: "true"
    optional: true
  WUD_SHOW_LIST:
    label: Show the container list
    help: Show the list of containers
    kind: boolean
    default: "true"
    optional: true
  WUD_SHOW_LOCAL_VERSION:
    label: Show the current version
    help: Show each container's current version instead of "Available"
    kind: boolean
    default: "true"
    optional: true
  WUD_SHOW_UPDATE_KIND:
    label: Show the update kind
    help: Show whether each update is major, minor or patch, and its new tag
    kind: boolean
    default: "true"
    optional: true
  WUD_SHOW_UPDATE_TYPES:
    label: Show the update counts by type
    help: Show how many updates are major, minor, patch or unknown
    kind: boolean
    default: "false"
    optional: true
  WUD_URL:
    label: What's Up Docker address (without http://)
    help: IP address or host name and port of your WUD server, like 192.0.2.10:3000; the widget adds http://
    kind: host
    example: 192.0.2.10:3000
  YT_CHANNEL_USERNAME:
    label: YouTube channel's user name
    help: The user name of the YouTube channel whose videos show (RSS-Bridge's "By username")
    kind: text
    example: ExampleChannel
  YT_CLOSE_OUTSIDE:
    label: Close by clicking outside
    help: Close the video pop-up by clicking anywhere around it
    kind: boolean
    default: "false"
    optional: true
  YT_EMBED_INSTANCE:
    label: Embed address
    help: Where the videos are embedded from; any instance that supports YouTube embedding, ending in /embed/
    kind: text
    default: https://www.youtube-nocookie.com/embed/
    optional: true
widgets:
  air-quality:
    variants:
      - name: Air quality
        rewrite:
          - find: ${LAT}
            replace: ${AIR_QUALITY_LAT}
            count: 1
          - find: ${LON}
            replace: ${AIR_QUALITY_LON}
            count: 1
          - find: ${YOUR_TOKEN}
            replace: ${AIR_QUALITY_TOKEN}
            count: 1
  algal-bloom-update:
    variants:
      - rewrite:
          - find: beach/brighton-3
            replace: beach/${ALGAL_BEACH_ID}
            count: 1
  animals-display:
    variants:
      - null
      - null
      - null
      - rewrite:
          - find: |2-
                template: |
                <img
            replace: |2-
                template: |
                  <img
            count: 1
      - rewrite:
          - find: |2-
                template: |
                <img
            replace: |2-
                template: |
                  <img
            count: 1
      - rewrite:
          - find: |2-
                template: |
                <img
            replace: |2-
                template: |
                  <img
            count: 1
      - rewrite:
          - find: |2-
                template: |
                <img
            replace: |2-
                template: |
                  <img
            count: 1
  arr-releases:
    variants:
      - rewrite:
          - find: "service: radarr"
            replace: "service: ${ARR_SERVICE}"
            count: 1
          - find: "type: upcoming"
            replace: "type: ${ARR_TYPE}"
            count: 1
          - find: "size: medium"
            replace: "size: ${ARR_SIZE}"
            count: 1
          - find: "collapse-after: 3"
            replace: "collapse-after: ${ARR_COLLAPSE_AFTER}"
            count: 1
          - find: "show-grabbed: false"
            replace: "show-grabbed: ${ARR_SHOW_GRABBED}"
            count: 1
          - find: "interval: 20"
            replace: "interval: ${ARR_INTERVAL_DAYS}"
            count: 1
          - find: "#sort-time: asc"
            replace: "sort-time: ${ARR_SORT_TIME}"
            count: 1
          - find: '#cover-proxy: "https://proxy.example.com/radarrcover"'
            replace: 'cover-proxy: "${ARR_COVER_PROXY}"'
            count: 1
          - find: ${RADARR_API_URL}
            replace: ${ARR_API_URL}
            count: 1
          - find: ${RADARR_KEY}
            replace: ${ARR_API_KEY}
            count: 1
          - find: ${RADARR_URL}
            replace: ${ARR_LINK_URL}
            count: 2
  astronomy-picture-of-the-day:
    variants:
      - name: Image
      - name: Image with title
      - name: Image with title and explanation
        rewrite:
          - find: .JSON.String "explanation"
            replace: .JSON.String "0.explanation"
            count: 1
  audiobookshelf:
    variants:
      - name: Library stats
  audiobookshelf-personalized:
    variants:
      - rewrite:
          - find: 'library: "Podcasts"'
            replace: 'library: "${ABS_LIBRARY}"'
            count: 1
          - find: 'shelf: "continue-listening"'
            replace: 'shelf: "${ABS_SHELF}"'
            count: 1
          - find: "small-column: false"
            replace: "small-column: ${ABS_SMALL_COLUMN}"
            count: 1
          - find: "show-thumbnail: false"
            replace: "show-thumbnail: ${ABS_SHOW_THUMBNAIL}"
            count: 1
          - find: 'thumbnail-aspect-ratio: "square"'
            replace: |-
              thumbnail-aspect-ratio: "${ABS_THUMBNAIL_ASPECT}"
                  progress-bar: ${ABS_PROGRESS_BAR}
            count: 1
  azirevpn-connection-status:
    needs: It shows the connection of the machine Glance runs on, so that machine must connect through AzireVPN.
    variants:
      - name: Connection status
  backrest-job-status:
    needs: Backrest's authentication must be turned off, as the widget reads its API without logging in.
    variants:
      - rewrite:
          - find: "planId: ${BACKREST_PLAN_LOCAL}"
            replace: 'planId: "${BACKREST_PLAN_LOCAL}"'
            count: 1
          - find: "LIMIT: 5"
            replace: "LIMIT: ${BACKREST_LIMIT}"
            count: 1
          - find: "PRECISION: 1"
            replace: "PRECISION: ${BACKREST_PRECISION}"
            count: 1
          - find: "BACKREST_PLAN_TITLE: Local USB"
            replace: 'BACKREST_PLAN_TITLE: "${BACKREST_PLAN_HEADING}"'
            count: 1
  beszel-metrics:
    variants:
      - refuse: Needs an API token fetched by hand with a curl command; Beszel Server Stats shows your servers with just your Beszel e-mail and password.
  beszel-server-stats:
    variants:
      - rewrite:
          - find: "# email: ${BESZEL_EMAIL}"
            replace: 'email: "${BESZEL_EMAIL}"'
            count: 1
          - find: "# password: ${BESZEL_PASSWORD}"
            replace: 'password: "${BESZEL_PASSWORD}"'
            count: 1
  calibre-web-stats:
    variants:
      - name: Library stats
        rewrite:
          - find: |2
                headers:
                    Authorization: Basic ${CALIBREWEB_CREDS_B64}
            replace: |2
                basic-auth:
                  username: "${CALIBREWEB_USER}"
                  password: "${CALIBREWEB_PASSWORD}"
            count: 1
  calvin-and-hobbes:
    variants:
      - rewrite:
          - find: $yearOffset := 37
            replace: $yearOffset := ${CALVIN_YEAR_OFFSET}
            count: 1
  cats-as-a-service-photos:
    variants:
      - name: Cat photos
  cineplex-movies:
    variants:
      - rewrite:
          - find: 'subscription-key: "abc"'
            replace: 'subscription-key: "${CINEPLEX_SUBSCRIPTION_KEY}"'
            count: 1
          - find: 'filter-keyword: "Japanese"'
            replace: 'filter-keyword: "${CINEPLEX_FILTER}"'
            count: 1
          - find: "playing-now-only: false"
            replace: "playing-now-only: ${CINEPLEX_NOW_PLAYING_ONLY}"
            count: 1
          - find: "items: 10"
            replace: "items: ${CINEPLEX_ITEMS}"
            count: 1
  cloudflared-tunnels:

  wikipedia-on-this-day:
    variants:
      - name: On this day
        rewrite:
          - find: https://en.wikipedia.org/api
            replace: https://${WIKIPEDIA_LANGUAGE}.wikipedia.org/api
            count: 1
          - find: feed/onthisday/events/
            replace: feed/onthisday/${WIKIPEDIA_OTD_TYPE}/
            count: 1
          - find: $resp.JSON.Array "events"
            replace: $resp.JSON.Array "${WIKIPEDIA_OTD_TYPE}"
            count: 1
  wud-monitor:
    needs: To list stopped containers too, What's Up Docker needs WUD_WATCHER_LOCAL_WATCHALL=true in its own environment.
    variants:
      - name: Version 2.1
        rewrite:
          - find: "{{ $showInfo := true }}"
            replace: "{{ $showInfo := ${WUD_SHOW_INFO} }}"
            count: 1
          - find: "{{ $showList := true }}"
            replace: "{{ $showList := ${WUD_SHOW_LIST} }}"
            count: 1
          - find: "{{ $showAll := false }}"
            replace: "{{ $showAll := ${WUD_SHOW_ALL} }}"
            count: 1
          - find: "{{ $showUpdateKind := true }}"
            replace: "{{ $showUpdateKind := ${WUD_SHOW_UPDATE_KIND} }}"
            count: 1
          - find: "{{ $showUpdateTypes := false }}"
            replace: "{{ $showUpdateTypes := ${WUD_SHOW_UPDATE_TYPES} }}"
            count: 1
          - find: "{{ $showLocalVersion := true }}"
            replace: "{{ $showLocalVersion := ${WUD_SHOW_LOCAL_VERSION} }}"
            count: 1
          - find: "{{ $hasUpdates := false }}"
            replace: "{{ $hasUpdates := ${WUD_HIDE_UP_TO_DATE} }}"
            count: 1
          - find: '{{ $isSha256 := eq (slice $imageDigest 0 7) "sha256:" }}'
            replace: '{{ $isSha256 := and (ge (len $imageDigest) 11) (eq (slice $imageDigest 0 7) "sha256:") }}'
            count: 1
          - find: |-
              {{ else }}
                                          {{ $isSha256 := eq (slice $localValue 0 7) "sha256:" }}
            replace: |-
              {{ else }}
                                          {{ $isSha256 := and (ge (len $localValue) 11) (eq (slice $localValue 0 7) "sha256:") }}
            count: 1
      - name: Version 1.1 (old)
        rewrite:
          - find: "{{ $showAll := false }}"
            replace: "{{ $showAll := ${WUD_SHOW_ALL} }}"
            count: 1
          - find: "{{ $hasUpdates := false }}"
            replace: "{{ $hasUpdates := ${WUD_HIDE_UP_TO_DATE} }}"
            count: 1
  youtube-embedded-player:
    variants:
      - rewrite:
          - find: "u: LinusTechTips"
            replace: 'u: "${YT_CHANNEL_USERNAME}"'
            count: 1
          - find: "{{ $closeOutsideIframe := false }}"
            replace: "{{ $closeOutsideIframe := ${YT_CLOSE_OUTSIDE} }}"
            count: 1
          - find: '{{ $youtubeEmbedInstance := "https://www.youtube-nocookie.com/embed/" }}'
            replace: '{{ $youtubeEmbedInstance := "${YT_EMBED_INSTANCE}" }}'
            count: 1
      - rewrite:
          - find: "user: yourusername"
            replace: 'user: "${FRESHRSS_USER}"'
            count: 1
          - find: "t: seeBelowOnHowToGenerateOne"
            replace: 't: "${FRESHRSS_QUERY_TOKEN}"'
            count: 1
          - find: "{{ $closeOutsideIframe := false }}"
            replace: "{{ $closeOutsideIframe := ${YT_CLOSE_OUTSIDE} }}"
            count: 1
          - find: '{{ $youtubeEmbedInstance := "https://www.youtube-nocookie.com/embed/" }}'
            replace: '{{ $youtubeEmbedInstance := "${YT_EMBED_INSTANCE}" }}'
            count: 1
          - find: .JSON.String "origin.title"
            replace: .String "origin.title"
            count: 1
          - find: .JSON.String "origin.htmlUrl"
            replace: .String "origin.htmlUrl"
            count: 1
          - find: |2
                      <div class="card widget-content-frame thumbnail-parent">
            replace: |2
                      <div class="card widget-content-frame thumbnail-parent">
                        <div onclick="
                          const classPrefix = 'popup-youtube-';
                          const embedClass = classPrefix + 'embed';
                          const dimBgClass = classPrefix + 'dim';
                          const closeBtnClass = classPrefix + 'close';
                          const popupEmbedExistingDiv = document.querySelector('.' + embedClass);
                          if (!popupEmbedExistingDiv) {
                            const dimBackground = document.createElement('div');
                            dimBackground.className = dimBgClass;
                            dimBackground.style = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--color-widget-background-highlight); opacity: 0.7;';
                            document.body.appendChild(dimBackground);
                            
                            const popupEmbedDiv = document.createElement('div');
                            popupEmbedDiv.className = embedClass;
                            popupEmbedDiv.style = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: {{ $popupWidth }}; height: {{ $popupHeight }}; z-index: 11;';

                            const popupIframe = document.createElement('iframe');
                            popupIframe.className = classPrefix + 'iframe';
                            popupIframe.src = {{ $youtubeEmbedUrl }};
                            popupIframe.loading = 'lazy';
                            popupIframe.allowFullscreen = true;
                            popupIframe.allow = {{ $iframeAllow }};
                            popupIframe.style ='outline: 2px solid var(--color-primary); outline-offset: -0.1rem; border-radius: 20px; width: 100%; height: 100%; border: none; background-color: var(--color-popover-background);';
                            
                            popupEmbedDiv.appendChild(popupIframe);
                            document.body.appendChild(popupEmbedDiv);

                            const closeBtn = document.createElement('span');
                            closeBtn.className = closeBtnClass;
                            closeBtn.innerHTML = '&times';
                            closeBtn.style = 'cursor: pointer; font-size: 3rem; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; position: absolute; top: 3rem; right: 3rem;';
                            document.body.appendChild(closeBtn);
                            document.body.style.overflowY = 'hidden';
                            
                            const closePopup = () => {
                              popupEmbedDiv.remove();
                              dimBackground.remove();
                              closeBtn.remove();
                              document.body.style.overflowY = 'scroll';
                            }

                            {{ if $closeOutsideIframe }} dimBackground.onclick = closePopup; {{ end }}
                            closeBtn.onclick = closePopup;
                          } else {
                            document.querySelector('.' + dimBgClass).remove();
                            document.querySelector('.' + closeBtnClass).remove();
                            document.body.style.overflowY = 'scroll';
                            popupEmbedExistingDiv.remove();
                          }
                        " style="cursor: pointer;">
                          <span>
                            {{ if ne $thumbnail "" }}
                            <img class="video-thumbnail thumbnail" loading="lazy" src="{{ $thumbnail }}" alt="">
                            {{ else }}
                            <svg class="video-thumbnail thumbnail" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="var(--color-text-subdue)">
                              <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                            </svg>
                            {{ end }}
                          </span>
                        </div>
                        <div class="margin-bottom-widget padding-inline-widget flex flex-column grow">
                          <div class="margin-top-10 margin-bottom-auto">
                            <a href="{{ $youtubeUrl }}#" class="color-primary-if-not-visited text-truncate-2-lines" target="_blank" rel="noreferrer">
                              {{ $title }}
                            </a>
                          </div>
                          <ul class="list-horizontal-text flex-nowrap margin-top-7">
                            <li class="shrink-0" {{ $timestamp | toRelativeTime }}></li>
                            <li class="min-width-0">
                              <a href="{{ $authorUrl }}" class="color-primary-if-not-visited text-truncate-2-lines" target="_blank" rel="noreferrer">
                                {{ $author }}
                              </a>
                            </li>
                          </ul>
                        </div>
                      </div>
                      {{ end }}
                    {{ end }}
                  </div>
            count: 1

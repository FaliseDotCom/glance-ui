name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull pinned Glance image
        run: |
          source glance.version
          docker pull "$GLANCE_IMAGE"
      - name: Run tests
        run: scripts/test.sh

  glance-smoke:
    name: Glance accepts generated config
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate sample config
        run: scripts/generate-sample-config.sh "$RUNNER_TEMP/glance.yml"
      - name: Validate with pinned Glance
        run: |
          source glance.version
          mkdir -p "$RUNNER_TEMP/cfg" && cp "$RUNNER_TEMP/glance.yml" "$RUNNER_TEMP/cfg/glance.yml"
          docker run --rm --network none -v "$RUNNER_TEMP/cfg:/app/config:ro" "$GLANCE_IMAGE" config:validate
      # Glance v0.8.6 exits with code 0 on an invalid startup config (see docs/lessons.md),
      # so the smoke test treats ANY exit as a failure rather than relying on the exit code.
      - name: Start Glance and fail if it exits
        run: test/glance-smoke.sh "$RUNNER_TEMP/glance.yml"
